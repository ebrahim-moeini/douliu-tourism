<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>TFTW 斗六友善觀光網</title>
  <style>
    /* ==========================================
       基礎設定 & CSS變數 (設計系統)
       ========================================== */
    :root {
      --primary-color: #2c3e50;     /* 深藍灰 (經典質感) */
      --accent-color: #e07a5f;      /* 溫暖橘紅 */
      --vr-color: #2a9d8f;          /* 360環景專用青綠色 */
      --bg-color: #f7f9fb;          /* 輕盈淺灰底色 */
      --card-bg: #ffffff;
      --text-main: #2b2d42;
      --text-sub: #6c757d;
      --shadow-sm: 0 4px 12px rgba(0, 0, 0, 0.05);
      --shadow-lg: 0 8px 24px rgba(0, 0, 0, 0.12);
      --radius-lg: 16px;
      --radius-md: 12px;
      --radius-full: 999px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent; /* 去除手機點擊高亮藍框 */
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans TC", sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      line-height: 1.5;
    }

    /* ==========================================
       1. 最頂端 Logo 區塊 (文字標誌: TFTW 斗六友善觀光網)
       ========================================== */
    .site-header {
      background: var(--card-bg);
      padding: 16px 20px;
      text-align: center;
      box-shadow: 0 2px 8px rgba(0,0,0,0.04);
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .brand-logo {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      text-decoration: none;
    }

    .brand-title {
      font-size: 1.25rem;
      font-weight: 800;
      color: var(--primary-color);
      letter-spacing: 0.5px;
      line-height: 1.2;
    }

    .brand-tag {
      display: inline-block;
      background-color: rgba(59, 89, 152, 0.08);
      color: var(--primary-color);
      font-size: 0.75rem;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 6px;
      margin-left: 6px;
      vertical-align: middle;
    }

    /* ==========================================
       主要內容區塊 (Mobile-First 限制寬度)
       ========================================== */
    .main-content {
      flex: 1;
      padding: 20px 16px;
      max-width: 600px;
      margin: 0 auto;
      width: 100%;
    }

    .guide-intro {
      text-align: center;
      margin-bottom: 20px;
    }

    .guide-intro h1 {
      font-size: 1.2rem;
      font-weight: 700;
      color: var(--text-main);
    }

    .guide-intro p {
      font-size: 0.85rem;
      color: var(--text-sub);
      margin-top: 4px;
    }

    /* ==========================================
       2. 景點圖片按鈕卡片
       ========================================== */
    .nav-list {
      display: flex;
      flex-direction: column;
      gap: 16px;
      margin-bottom: 28px;
    }

    .nav-card {
      position: relative;
      display: block;
      height: 140px;
      border-radius: var(--radius-lg);
      overflow: hidden;
      text-decoration: none;
      box-shadow: var(--shadow-sm);
      transition: transform 0.2s cubic-bezier(0.25, 1, 0.5, 1), box-shadow 0.2s ease;
    }

    .nav-card:active {
      transform: scale(0.98);
      box-shadow: 0 2px 6px rgba(0,0,0,0.08);
    }

    .nav-card-bg {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.4s ease;
    }

    .nav-card-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, rgba(0,0,0,0.1) 0%, rgba(0,0,0,0.65) 100%);
      display: flex;
      align-items: flex-end;
      padding: 16px 20px;
    }

    .nav-card-title {
      color: #ffffff;
      font-size: 1.35rem;
      font-weight: 700;
      letter-spacing: 0.5px;
      text-shadow: 0 2px 4px rgba(0,0,0,0.4);
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
    }

    .nav-card-title::after {
      content: "➔";
      font-size: 1rem;
      opacity: 0.8;
      transition: transform 0.2s ease;
    }

    /* ==========================================
       3. 實境 360 環景按鈕
       ========================================== */
    .vr-section {
      margin-bottom: 28px;
    }

    .vr-button {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      padding: 16px 20px;
      background: linear-gradient(135deg, var(--vr-color) 0%, #218377 100%);
      color: #ffffff;
      font-size: 1.1rem;
      font-weight: 700;
      text-decoration: none;
      border-radius: var(--radius-lg);
      box-shadow: 0 4px 14px rgba(42, 157, 143, 0.35);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .vr-button:active {
      transform: scale(0.98);
      box-shadow: 0 2px 8px rgba(42, 157, 143, 0.25);
    }

    .vr-icon {
      font-size: 1.3rem;
      display: inline-block;
      animation: rotateIcon 10s linear infinite;
    }

    @keyframes rotateIcon {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    /* ==========================================
       4. Google Map 地圖嵌入區塊
       ========================================== */
    .map-section {
      background: var(--card-bg);
      border-radius: var(--radius-lg);
      padding: 16px;
      box-shadow: var(--shadow-sm);
      margin-bottom: 24px;
    }

    .map-header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 12px;
    }

    .map-header h2 {
      font-size: 1rem;
      font-weight: 700;
      color: var(--text-main);
    }

    .map-container {
      position: relative;
      width: 100%;
      padding-top: 66.66%; /* 3:2 響應式高寬比 */
      border-radius: var(--radius-md);
      overflow: hidden;
      background-color: #e5e5e5;
    }

    .map-container iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: 0;
    }

    /* ==========================================
       浮動語音助理按鈕 (Floating Action Button)
       ========================================== */
    .voice-assistant-fab {
      position: fixed;
      bottom: 24px;
      right: 20px;
      z-index: 100;
      display: flex;
      align-items: center;
      background: var(--card-bg);
      padding: 6px 14px 6px 6px;
      border-radius: var(--radius-full);
      box-shadow: var(--shadow-lg);
      border: 1px solid rgba(0,0,0,0.06);
      cursor: pointer;
      user-select: none;
      animation: floatPulse 3s infinite ease-in-out;
    }

    .assistant-avatar {
      width: 48px;
      height: 48px;
      border-radius: var(--radius-full);
      background-color: #f0e6df;
      overflow: hidden;
      flex-shrink: 0;
      border: 2px solid var(--accent-color);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .assistant-avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .assistant-info {
      margin-left: 10px;
      display: flex;
      flex-direction: column;
    }

    .assistant-title {
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--text-main);
    }

    .assistant-desc {
      font-size: 0.725rem;
      color: var(--accent-color);
      font-weight: 600;
    }

    @keyframes floatPulse {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-6px); }
    }

    .voice-assistant-fab.is-playing {
      border-color: var(--accent-color);
      background: #fff8f6;
    }

    /* ==========================================
       5. 底下版權聲明 (Footer)
       ========================================== */
    .site-footer {
      background-color: var(--card-bg);
      text-align: center;
      padding: 24px 16px;
      margin-top: auto;
      border-top: 1px solid #eef2f5;
    }

    .copyright {
      font-size: 0.75rem;
      color: var(--text-sub);
      line-height: 1.6;
    }

    /* 微響應式調整 (針對平板與桌面) */
    @media (min-width: 768px) {
      .nav-card {
        height: 160px;
      }
      .nav-card:hover .nav-card-bg {
        transform: scale(1.03);
      }
      .nav-card:hover .nav-card-title::after {
        transform: translateX(4px);
      }
      .vr-button:hover {
        transform: translateY(-2px);
        box-shadow: 0 6px 18px rgba(42, 157, 143, 0.45);
      }
    }
  </style>
</head>
<body>

  <!-- 1. 最頂端 Logo 區塊 (替換為 TFTW 斗六友善觀光網 文字標誌) -->
  <header class="site-header">
    <div class="brand-logo">
      <span class="brand-title">TFTW 斗六友善觀光網</span>
    </div>
  </header>

  <!-- 主要導覽選單與地圖區塊 -->
  <main class="main-content">
    <div class="guide-intro">
      <h1>探索在地景點</h1>
      <p>點擊景點卡片或開啟地圖開始漫遊</p>
    </div>

    <!-- 2. 三個景點圖片按鈕 -->
    <nav class="nav-list">
      <!-- 太平老街 -->
      <a href="#taiping" class="nav-card">
        <img class="nav-card-bg" src="https://images.unsplash.com/photo-1541971875076-8f970d573be6?auto=format&fit=crop&w=600&q=80" alt="太平老街">
        <div class="nav-card-overlay">
          <div class="nav-card-title">太平老街</div>
        </div>
      </a>

      <!-- 雲中街 -->
      <a href="/douliu-tourism/yunzhong" class="nav-card">
        <img class="nav-card-bg" src="https://images.unsplash.com/photo-1513694203232-719a280e022f?auto=format&fit=crop&w=600&q=80" alt="雲中街">
        <div class="nav-card-overlay">
          <div class="nav-card-title">雲中街</div>
        </div>
      </a>

      <!-- 行啟紀念館 -->
      <a href="#xingqi" class="nav-card">
        <img class="nav-card-bg" src="https://images.unsplash.com/photo-1513584684374-8bab748fbf90?auto=format&fit=crop&w=600&q=80" alt="行啟紀念館">
        <div class="nav-card-overlay">
          <div class="nav-card-title">行啟紀念館</div>
        </div>
      </a>
    </nav>

    <!-- 3. 實境 360 環景按鈕 -->
    <section class="vr-section">
      <a href="#vr-panorama" class="vr-button">
        <span class="vr-icon">🌐</span>
        <span>實境 360 環景體驗</span>
      </a>
    </section>

    <!-- 4. Google Map 地圖嵌入區塊 -->
    <section class="map-section">
      <div class="map-header">
        <span>📍</span>
        <h2>導覽地圖</h2>
      </div>
      <div class="map-container">
        <!-- 預設嵌入斗六周邊 Google 地圖 -->
        <iframe 
          src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d14603.957640428383!2d120.5369!3d23.7088!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x346ec814bd93c83b%3A0xb35a0f1288c8f001!2zOTcw6p-S5p6X57i_O-aXp-a8k-S4p-aXpA!5e0!3m2!1szh-TW!2stw!4v1700000000000!5m2!1szh-TW!2stw" 
          allowfullscreen="" 
          loading="lazy" 
          referrerpolicy="no-referrer-when-downgrade">
        </iframe>
      </div>
    </section>
  </main>

  <!-- 浮動式語音小助理按鈕 -->
  <div class="voice-assistant-fab" id="voiceFab" onclick="toggleVoiceGuide()">
    <div class="assistant-avatar">
      <img src="https://api.dicebear.com/7.x/bottts/svg?seed=GuideBuddy" alt="線上導覽小助理">
    </div>
    <div class="assistant-info">
      <div class="assistant-title">線上小助理</div>
      <div class="assistant-desc" id="voiceStatus">🔊 點擊語音導覽</div>
    </div>
  </div>

  <!-- 5. 底下版權聲明 -->
  <footer class="site-footer">
    <p class="copyright">
      &copy; 2026 TFTW 斗六友善觀光網 版權所有<br>
      Copyright &copy; All Rights Reserved.
    </p>
  </footer>

  <!-- 簡易互動邏輯 -->
  <script>
    let isPlaying = false;

    function toggleVoiceGuide() {
      const fab = document.getElementById('voiceFab');
      const statusText = document.getElementById('voiceStatus');
      
      isPlaying = !isPlaying;

      if (isPlaying) {
        fab.classList.add('is-playing');
        statusText.innerText = '▶ 播放語音中...';
      } else {
        fab.classList.remove('is-playing');
        statusText.innerText = '🔊 點擊語音導覽';
      }
    }
  </script>
</body>
</html>
